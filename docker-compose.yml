services:
  # ─── API BACKEND NESTJS ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanto_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kanto}?schema=public
      - REDIS_URL=redis://redis:6379
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - kanto_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kanto_network

  # ─── BASE DE DONNÉES POSTGRESQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kanto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kanto}
    volumes:
      - kanto_pgdata:/var/lib/postgresql/data
    # Port lié uniquement à l'interface locale pour éviter l'exposition publique sur VPS
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kanto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kanto_network

  # ─── CACHE & WEBSOCKET PUB/SUB REDIS ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kanto_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kanto_redisdata:/data
    # Port lié uniquement à l'interface locale pour éviter l'exposition publique sur VPS
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kanto_network

# ─── VOLUMES PERSISTANTS ──────────────────────────────────────────────────────
volumes:
  kanto_pgdata:
    name: kanto_pgdata
  kanto_redisdata:
    name: kanto_redisdata
  kanto_uploads:
    name: kanto_uploads

# ─── RÉSEAU ISOLÉ ─────────────────────────────────────────────────────────────
networks:
  kanto_network:
    name: kanto_network
    driver: bridge
